<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Jot it down. Find it later.</p>
  </header>

  <main>
    <section id="add-section" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form">
        <div class="field grow">
          <label for="note-input">Note</label>
          <input type="text" id="note-input" name="note" placeholder="Type your note here">
        </div>

        <div class="field">
          <label for="category-select">Category</label>
          <select id="category-select" name="category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message" role="alert"></p>
    </section>

    <section id="notes-section" aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <label for="search-input">Search notes</label>
      <input type="search" id="search-input" placeholder="Search your notes">
      <p id="note-count"></p>
      <button type="button" id="clear-all">Clear all</button>
      <div id="notes-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
